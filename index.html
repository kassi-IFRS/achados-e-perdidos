function flagsOf(i){
  var f=[];
  if(i.status==="ativo"){
    var dup=DB.items.some(function(o){return o.id<i.id&&o.status==="ativo"&&o.tipo===i.tipo&&norm(o.nome)===norm(i.nome)&&o.cat===i.cat});
    if(dup)f.push("dup");
    if(/@|\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b|\(?\b\d{2}\)?\s?\d{4,5}[-\s]?\d{4}\b|\b\d{4,5}[-\s]?\d{4}\b/.test(i.desc+" "+i.nome))f.push("pes");
    if(diffDays(i.data)>30)f.push("old");
  }else if(i.status==="resolvido")f.push("res");
  return f;
}

  return crumbs(["Administração › Moderação"].map(function(x){return x}))+(flash?banner(flash.kind||"ok",flash.html):"")+'<h1>Moderação de anúncios</h1><p class="mut">Revise, remova impróprios ou duplicados e arquive os antigos ou já resolvidos.</p>'+

  '<form data-form="mod" class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end" novalidate>'+
  '<div class="f"><label class="l" for="msit">Situação</label><select id="msit"><option value="revisar"'+(modF.sit==="revisar"?" selected":"")+'>Para revisar</option><option value="aviso"'+(modF.sit==="aviso"?" selected":"")+'>Com aviso do sistema</option><option value="arquivar"'+(modF.sit==="arquivar"?" selected":"")+'>Resolvidos para arquivar</option><option value="todos"'+(modF.sit==="todos"?" selected":"")+'>Todos</option></select></div>'+

/* ---------- roteamento ---------- */
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
var AUTH=/^(perdido|achado|meus-itens|contato-\d+|editar-\d+|mensagens-\d+|moderacao)$/;
function route(){
  var h=location.hash.slice(1)||"inicio",u=me(),html="",key=h,m;
  $("#nav").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");
  if(AUTH.test(h)&&!u){nextRoute=h;flash=null;location.replace("#entrar");return}
  if(h==="moderacao"&&!(u&&u.admin)){html='<div class="card empty center"><h1>Área da administração</h1><p class="mut">Só administradores acessam a moderação.</p><a class="btn pri" href="#inicio">Voltar ao início</a></div>'}
  else if(h==="inicio")html=viewHome();
  else if(h==="resultados")html=viewResults();
  else if(h==="entrar"){if(u){html=null;go(u.admin?"moderacao":"inicio");return}html=viewLogin()}
  else if(h==="perdido"||h==="achado")html=viewForm(h);
  else if(h==="meus-itens")html=viewMine();
  else if(h==="como-funciona")html=viewHow();
  else if(h==="moderacao")html=viewMod();
  else if(h==="feito")html=viewDone();
  else if(m=h.match(/^item-(\d+)$/))html=viewItem(m[1]);
  else if(m=h.match(/^contato-(\d+)$/))html=viewContact(m[1]);
  else if(m=h.match(/^mensagens-(\d+)$/))html=viewMsgs(m[1]);
  else if(m=h.match(/^editar-(\d+)$/)){var it=itemById(m[1]);html=it&&it.dono===u.id&&it.status!=="removido"?viewForm(it.tipo,it):viewMissing()}
  else html=viewMissing();
  if(html===null)return;
  header(h.replace(/-\d+$/,"")==="item"?"":h);
  app.innerHTML=html;
  if(!/^(meus-itens|moderacao)$/.test(h))flash=h==="feito"?flash:null;
  else flash=null;
  if(h==="perdido"||h==="achado"||/^editar-/.test(h))initPhoto();
  window.scrollTo(0,0);
  var t=$("h1",app);if(t){t.setAttribute("tabindex","-1");try{t.focus({preventScroll:true})}catch(e){}}
}

/* ---------- foto ---------- */
function initPhoto(){
  var pv=$("#pv"),pick=$("#pickBtn"),rm=$("#rmBtn");
  function draw(){pv.innerHTML=formState.foto?'<img src="'+formState.foto+'" alt="Prévia da foto">':ICON;pick.textContent=formState.foto?"Trocar foto":"Escolher foto";rm.hidden=!formState.foto}
  draw();formState.draw=draw;
  $("#file").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){$("#fotoMsg").textContent="Escolha um arquivo de imagem (JPG ou PNG).";$("#fotoMsg").className="err";return}
    var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){
      var s=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);formState.foto=c.toDataURL("image/jpeg",.72);formState.dirty=true;$("#fotoMsg").className="help";$("#fotoMsg").textContent="Foto adicionada.";draw()};
      img.onerror=function(){$("#fotoMsg").textContent="Não foi possível ler essa imagem. Tente outra.";$("#fotoMsg").className="err"};img.src=r.result};
    r.readAsDataURL(f);e.target.value="";
  });
}

function welcome(u,novo){DB.session=u.id;saveDB();var n=nextRoute;nextRoute=null;
  flash={page:true,title:"Você entrou como "+u.nome+".",h:novo?"Cadastro feito. Bem-vindo(a), "+first(u.nome)+"!":"Que bom ver você, "+first(u.nome)+".",text:"Seu contato não fica público: é usado só para a devolução.",actions:[["Continuar",n&&!(n==="moderacao"&&!u.admin)?n:(u.admin?"moderacao":"inicio")]]};go("feito")}

/* ---------- eventos globais ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest&&e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act");if(el.tagName==="SELECT")return;if(acts[a]){e.preventDefault();acts[a](el)}});
document.addEventListener("change",function(e){var el=e.target;
  if(el.getAttribute&&el.getAttribute("data-act")==="ord"){acts.ord(el);return}
  if(el.id==="msit"||el.id==="mtipo"){modF.sit=$("#msit").value;modF.tipo=$("#mtipo").value;route()}
  var f=el.closest&&el.closest("form[data-form=item]");if(f)formState.dirty=true;
  if(el.closest&&el.closest("form[data-form=search]")&&location.hash.slice(1)==="resultados"&&el.id!=="q"){S.cat=$("#cat").value;S.local=$("#local").value;S.data=$("#data").value;route()}
});
document.addEventListener("input",function(e){var el=e.target;
  if(el.id==="mq"){modF.q=el.value;var pos=el.selectionStart;route();var n=$("#mq");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}
  if(el.getAttribute&&el.getAttribute("aria-invalid")==="true"){el.removeAttribute("aria-invalid");var er=$("#"+el.id+"-e");if(er)er.hidden=true}
  var f=el.closest&&el.closest("form[data-form=item]");if(f)formState.dirty=true});
document.addEventListener("submit",function(e){var f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();var h=forms[f.getAttribute("data-form")];if(h)h(f)});
$("#menuBtn").addEventListener("click",function(){var n=$("#nav"),o=n.classList.toggle("open");this.setAttribute("aria-expanded",o)});
window.addEventListener("hashchange",route);
try{var th=localStorage.getItem("ap-theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
loadDB();route();
})();

</script>
